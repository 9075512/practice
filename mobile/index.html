<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b6bff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="背题库" />
    <meta name="description" content="按题库与题型背题，翻卡即学" />
    <title>背题库</title>
    <script>
      // flex gap 兼容检测：不支持时给 <html> 加 .no-flex-gap，
      // CSS 里用相邻兄弟 margin 回退（iOS < 14.1 / 旧安卓 WebView 无 flex gap）
      (function () {
        try {
          var d = document.createElement('div');
          d.style.cssText = 'display:inline-flex;gap:1px;position:absolute;visibility:hidden;';
          d.innerHTML = '<i style="width:1px"></i><i style="width:1px"></i>';
          document.documentElement.appendChild(d);
          var ok = d.getBoundingClientRect().width >= 2.5;
          document.documentElement.removeChild(d);
          if (!ok) document.documentElement.className += ' no-flex-gap';
        } catch (e) {
          document.documentElement.className += ' no-flex-gap';
        }
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- 带版本号：发版后手机端不会继续用旧样式，避免「改了样式但页面还是乱的」 -->
    <link rel="stylesheet" href="css/app.css?v=20261020g" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div id="modal-root" class="modal-root"></div>
    <script>
      // 接口地址：默认同源 /api/mp。若静态页与后端不同源，可在这里改成完整地址，
      // 例如 window.APP_CONFIG = { apiBase: 'http://192.168.1.45:3000/api/mp' }
      window.APP_CONFIG = { apiBase: '/api/mp' };
    </script>
    <script src="js/workbuddy-cloud-sdk.global.js"></script>
    <script type="module" src="js/app.js?v=20261020g"></script>
  </body>
</html>
